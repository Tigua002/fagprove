<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header class="header">
    <button class="header-back" aria-label="Go back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="header-title">New Expense</span>
    <button class="header-save" id="save-btn">Save draft</button>
  </header>

  <!-- Amount hero -->
  <div class="amount-card">
    <div class="amount-label">Total Amount *</div>
    <div class="amount-row">
      <div class="currency-badge" id="currency-toggle" role="button" tabindex="0" aria-haspopup="listbox" aria-label="Select currency">
        <span id="currency-label">NOK</span>
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        <div class="currency-menu" id="currency-menu" role="listbox">
          <div class="currency-opt selected" data-val="NOK">NOK</div>
          <div class="currency-opt" data-val="USD">USD</div>
          <div class="currency-opt" data-val="EUR">EUR</div>
          <div class="currency-opt" data-val="GBP">GBP</div>
          <div class="currency-opt" data-val="SEK">SEK</div>
          <div class="currency-opt" data-val="DKK">DKK</div>
        </div>
      </div>
      <input id="amount-input" type="number" inputmode="decimal" placeholder="0.00" min="0" step="0.01" aria-label="Amount" />
    </div>
    <hr class="amount-divider" />
    <div class="quick-actions">
      <button class="qa-btn" title="Scan receipt">
        <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="12" y2="15"/></svg>
        Receipt
      </button>
      <button class="qa-btn" title="Take photo">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Photo
      </button>
      <button class="qa-btn" title="Attach file">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        Attach
      </button>
      <button class="qa-btn" title="Templates">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Template
      </button>
    </div>
  </div>

  <!-- Required fields -->
  <div class="fields-card" id="required-fields">

    <!-- Expense Type -->
    <div class="field-row" id="row-type" role="button" tabindex="0" aria-expanded="false">
      <div class="field-icon">
        <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
      </div>
      <div class="field-text">
        <div class="field-label">Expense Type *</div>
        <div class="field-value" id="val-type">Select a category</div>
      </div>
      <div class="field-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      <div class="field-tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    </div>
    <div class="field-input-wrap" id="inp-type">
      <select id="select-type" aria-label="Expense type">
        <option value="">— choose type —</option>
        <option value="Lunch">Lunch</option>
        <option value="Dinner">Dinner</option>
        <option value="Travel">Travel</option>
        <option value="Accommodation">Accommodation</option>
        <option value="Office supplies">Office supplies</option>
        <option value="Software / SaaS">Software / SaaS</option>
        <option value="Client entertainment">Client entertainment</option>
        <option value="Training / courses">Training / courses</option>
        <option value="Other">Other</option>
      </select>
      <button class="apply-btn" data-target="type">Apply</button>
    </div>

    <!-- Date -->
    <div class="field-row" id="row-date" role="button" tabindex="0" aria-expanded="false">
      <div class="field-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="field-text">
        <div class="field-label">Date *</div>
        <div class="field-value" id="val-date">Select date</div>
      </div>
      <div class="field-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      <div class="field-tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    </div>
    <div class="field-input-wrap" id="inp-date">
      <input type="date" id="input-date" aria-label="Expense date" />
      <button class="apply-btn" data-target="date">Apply</button>
    </div>

    <!-- Description -->
    <div class="field-row" id="row-desc" role="button" tabindex="0" aria-expanded="false">
      <div class="field-icon">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </div>
      <div class="field-text">
        <div class="field-label">Description</div>
        <div class="field-value" id="val-desc">Add a short note</div>
      </div>
      <div class="field-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      <div class="field-tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    </div>
    <div class="field-input-wrap" id="inp-desc">
      <input type="text" id="input-desc" placeholder="e.g. Team lunch at Aker Brygge" maxlength="120" aria-label="Description" />
      <button class="apply-btn" data-target="desc">Apply</button>
    </div>

  </div><!-- /required-fields -->

  <!-- Optional fields -->
  <div class="optional-card">
    <div class="section-label">Optional details</div>

    <!-- Attendees -->
    <div class="field-row" id="row-att" role="button" tabindex="0" aria-expanded="false">
      <div class="field-icon">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="field-text">
        <div class="field-label">Attendees</div>
        <div class="field-value" id="val-att">Initials, separated by commas</div>
      </div>
      <div class="field-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      <div class="field-tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    </div>
    <div class="field-input-wrap" id="inp-att">
      <input type="text" id="input-att" placeholder="e.g. AB, CD, EF" aria-label="Attendee initials" />
      <button class="apply-btn" data-target="att">Apply</button>
    </div>

    <!-- Country -->
    <div class="field-row" id="row-country" role="button" tabindex="0" aria-expanded="false">
      <div class="field-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </div>
      <div class="field-text">
        <div class="field-label">Country</div>
        <div class="field-value" id="val-country">Where did this occur?</div>
      </div>
      <div class="field-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      <div class="field-tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    </div>
    <div class="field-input-wrap" id="inp-country">
      <select id="select-country" aria-label="Country">
        <option value="">— select country —</option>
        <option value="Norway" selected>Norway</option>
        <option value="Sweden">Sweden</option>
        <option value="Denmark">Denmark</option>
        <option value="Finland">Finland</option>
        <option value="Germany">Germany</option>
        <option value="France">France</option>
        <option value="United Kingdom">United Kingdom</option>
        <option value="United States">United States</option>
        <option value="Other">Other</option>
      </select>
      <button class="apply-btn" data-target="country">Apply</button>
    </div>

    <!-- Comment -->
    <div class="field-row" id="row-comment" role="button" tabindex="0" aria-expanded="false">
      <div class="field-icon">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="field-text">
        <div class="field-label">Finance comment</div>
        <div class="field-value" id="val-comment">Leave a note for finance</div>
      </div>
      <div class="field-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      <div class="field-tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    </div>
    <div class="field-input-wrap" id="inp-comment">
      <input type="text" id="input-comment" placeholder="e.g. Client meeting, reimbursable" maxlength="160" aria-label="Finance comment" />
      <button class="apply-btn" data-target="comment">Apply</button>
    </div>

  </div><!-- /optional-card -->

  <!-- Submit -->
  <button class="submit-btn" id="submit-btn">
    Submit expense
    <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>

</div><!-- /shell -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
