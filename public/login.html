<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logg inn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <style>


  </style>
</head>
<body>

<div class="screen">

  <!-- Brand block -->
  <div class="brand-block">
    <div class="brand-logo">
      <div class="brand-logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <span class="brand-logo-name">Expenzo</span>
    </div>
    <div class="brand-headline">Velkommen<br>tilbake.</div>
    <div class="brand-sub">Logg inn for å se og administrere<br>dine utgifter og rapporter.</div>
  </div>

  <!-- Form -->
  <div class="form-wrap" id="formWrap">

    <!-- Email -->
    <div class="form-label-group">
      <label class="form-label" for="emailInput">E-post</label>
      <div class="input-wrap">
        <div class="input-icon">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <input type="email" id="emailInput" placeholder="navn@selskap.no" autocomplete="email" />
      </div>
      <div class="field-error" id="emailError">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Skriv inn en gyldig e-postadresse
      </div>
    </div>

    <!-- Password -->
    <div class="form-label-group">
      <label class="form-label" for="passwordInput">Passord</label>
      <div class="input-wrap" style="position:relative;">
        <div class="input-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" style="padding-right:2.8rem;" />
        <button class="eye-toggle" id="eyeToggle" type="button" aria-label="Vis passord">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="field-error" id="passwordError">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Passordet må ha minst 6 tegn
      </div>
    </div>

    <!-- Forgot -->
    <div class="forgot-row">
      <a href="#" class="forgot-link">Glemt passord?</a>
    </div>

    <!-- Submit -->
    <button class="submit-btn" id="submitBtn" type="button">
      <span class="btn-label">Logg inn</span>
      <svg class="btn-arrow" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      <div class="spinner"></div>
    </button>


    <!-- Register -->
    <div class="register-row">
      Har du ikke konto? <a href="#">Registrer deg</a>
    </div>

  </div>
</div>

<!-- Success overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-check">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <div class="success-title">Innlogget!</div>
  <div class="success-sub">Du blir videresendt til oversikten…</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="login.js"></script>
</body>
</html>
